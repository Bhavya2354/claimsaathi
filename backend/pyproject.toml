[project]
name = "claimsaathi"
version = "0.1.0"
description = "Health insurance claim audit: bill checks, policy answers and appeal letters with clause citations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "en-core-web-sm",
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "onnxruntime>=1.31.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.362",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "qdrant-client[fastembed]>=1.19.1",
    "rapidocr>=3.10.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "truststore>=0.10.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claimsaathi = "app.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "PTH", "PL", "TRY", "S", "ASYNC"]
ignore = ["PLR0913", "TRY003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/**" = ["PLR0917", "B008"]
"migrations/**" = ["E501"]
"tests/**" = ["S101", "PLR2004", "S106"]
# Seeded test-data generation: reproducible pseudo-randomness and probability thresholds.
"app/evals/synthetic.py" = ["S311", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# PyMuPDF ships partial type hints; its constructors are untyped.
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*", "rapidocr.*", "presidio_analyzer.*", "presidio_anonymizer.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = ["live: calls real model providers (needs API keys or a running Ollama)"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
